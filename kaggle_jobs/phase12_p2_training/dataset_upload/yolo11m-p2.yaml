# Ultralytics YOLO11m with P2/4 Stride-4 Micro-Detection Head
# Architecture: P2/4, P3/8, P4/16, P5/32 feature pyramid outputs
# Optimized for small-object spatial feature retention (<32² px COCO bracket)

nc: 10 # BDD100K 10 classes
scales:
  # [depth, width, max_channels]
  m: [0.50, 1.00, 512]

# YOLO11 Backbone with P2 extraction tap
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]       # 0 - P1/2
  - [-1, 1, Conv, [128, 3, 2]]      # 1 - P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2 - P2/4 feature tap (output for P2 skip connection)
  - [-1, 1, Conv, [256, 3, 2]]      # 3 - P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4 - P3/8 feature tap
  - [-1, 1, Conv, [512, 3, 2]]      # 5 - P4/16
  - [-1, 2, C3k2, [512, True]]       # 6 - P4/16 feature tap
  - [-1, 1, Conv, [1024, 3, 2]]     # 7 - P5/32
  - [-1, 2, C3k2, [1024, True]]      # 8 - P5/32 feature tap
  - [-1, 1, SPPF, [1024, 5]]        # 9 - Spatial Pyramid Pooling
  - [-1, 2, C2PSA, [1024]]          # 10 - Cross Stage Attention

# YOLO11 P2-FPN/PAN Head
head:
  # Top-down FPN path
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]       # 12 - cat backbone P4 (stride 16)
  - [-1, 2, C3k2, [512, False]]     # 13 - FPN P4

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]       # 15 - cat backbone P3 (stride 8)
  - [-1, 2, C3k2, [256, False]]     # 16 - FPN P3

  # Additional P2/4 Top-down layer
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]       # 18 - cat backbone P2 (stride 4, 240x240 @ 960px)
  - [-1, 2, C3k2, [128, False]]     # 19 - FPN P2/4 (Micro-feature map)

  # Bottom-up PAN path
  - [-1, 1, Conv, [128, 3, 2]]      # 20 - Downsample to stride 8
  - [[-1, 16], 1, Concat, [1]]      # 21 - cat head P3
  - [-1, 2, C3k2, [256, False]]     # 22 - PAN P3

  - [-1, 1, Conv, [256, 3, 2]]      # 23 - Downsample to stride 16
  - [[-1, 13], 1, Concat, [1]]      # 24 - cat head P4
  - [-1, 2, C3k2, [512, False]]     # 25 - PAN P4

  - [-1, 1, Conv, [512, 3, 2]]      # 26 - Downsample to stride 32
  - [[-1, 10], 1, Concat, [1]]      # 27 - cat head P5
  - [-1, 2, C3k2, [1024, True]]     # 28 - PAN P5

  # 4-Scale Detection Head (P2/4, P3/8, P4/16, P5/32)
  - [[19, 22, 25, 28], 1, Detect, [nc]] # 29 - Detect(P2, P3, P4, P5)
